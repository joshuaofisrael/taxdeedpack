name: Fulfill ADMINJ order

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      order_json:
        description: Order JSON payload
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: adminj-fulfill
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.title, 'ADMINJ-ORDER') &&
       contains(join(github.event.issue.labels.*.name, ','), 'adminj-order'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract order JSON from issue or input
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let raw = '';
            if (context.eventName === 'workflow_dispatch') {
              raw = (context.payload.inputs && context.payload.inputs.order_json) || '';
            } else {
              const body = context.payload.issue.body || '';
              const match = body.match(/```json\s*([\s\S]*?)```/);
              if (!match) {
                core.setFailed('Issue body must include a json fenced block with the order payload.');
                return;
              }
              raw = match[1].trim();
            }
            if (!raw) {
              core.setFailed('Missing order JSON.');
              return;
            }
            fs.writeFileSync('artifacts-order.json', raw);
      - name: Generate PDF and email Joshua
        env:
          ORDER_JSON_FILE: artifacts-order.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npx tsx scripts/fulfill-github-order.ts
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: adminj-research-pack
          path: artifacts/
      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = {};
            try { result = JSON.parse(fs.readFileSync('artifacts/fulfill-result.json','utf8')); } catch {}
            const body = [
              'ADMINJ free test fulfillment finished.',
              '',
              `Order: ${result.orderId || 'unknown'}`,
              `PDF: ${result.filename || 'see workflow artifact'}`,
              result.emailed ? `Emailed only to joshuaofisrael@gmail.com` : 'Email skipped (add RESEND_API_KEY repo secret to auto-email). Download the workflow artifact for the PDF.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
